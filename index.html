<style>
:root{
  --bg:#0b0f16; --surface:#141a24; --surface-2:#1c2531; --line:#26303d;
  --text:#e8edf3; --muted:#7d8b9c; --faint:#4a5766;
  --plex:#e5a00d; --plex-dim:#3a2f12; --miss:#e5484d; --ok:#3fb950; --radius:13px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden}
body{max-width:640px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;width:100%}
header{padding:calc(24px + env(safe-area-inset-top)) 0 14px;display:flex;align-items:flex-start;justify-content:space-between}
h1{font-size:29px;font-weight:700;letter-spacing:-0.02em}
h1 .dot{color:var(--plex)}
.sync{font-family:'DM Mono',monospace;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.3s}
.sync.ok .d{background:var(--ok)}
.sync.busy .d{background:var(--plex);animation:pulse 1s infinite}
.sync.err .d{background:var(--miss)}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:6px;margin-top:6px;margin-bottom:12px;background:var(--surface);padding:5px;border-radius:13px;z-index:20}
.actions{display:flex;margin-bottom:16px}
.actbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--text);font-family:'Outfit';font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:44px}
.actbtn:active{background:var(--surface-2)}
.actbtn.add{border-style:dashed}
.actbtn .ic{font-size:16px;color:var(--plex);display:inline-flex;align-items:center;justify-content:center}
.refreshlink{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;margin-top:4px}
.refreshlink:active{color:var(--plex)}
.refreshlink .ic{color:var(--plex);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.refreshlink.spin .ic{animation:spin .8s linear infinite}
.tab{flex:1;text-align:center;padding:14px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:transparent;cursor:pointer;transition:.18s;letter-spacing:-0.01em;white-space:nowrap;min-height:44px}
.tab .n{font-family:'DM Mono',monospace;font-size:11px;margin-left:5px;opacity:.7}
.tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

.pill{font-family:'DM Mono',monospace;font-size:11px;font-weight:500}

.bar{height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:8px}

.archsec.open .archbody{display:block}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;backdrop-filter:blur(2px)}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transform:translateY(100%);transition:.28s cubic-bezier(.3,.9,.3,1);height:80vh;height:80dvh;max-height:80dvh;display:flex;flex-direction:column}

.search input::placeholder{color:var(--faint)}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

const today = () => new Date().toISOString().slice(0,10);

/* ====== SYNC (Cloudflare Worker + localStorage fallback) ====== */
const hasWorker = SYNC_URL && SYNC_TOKEN && !SYNC_URL.includes("__");
function setSync(cls,txt){const el=document.getElementById('sync');el.className='sync '+cls;document.getElementById('syncTxt').textContent=txt;}

// læs kun localStorage (hurtigt, synkront) — ingen ventetid
// fjerner ægte dubletter (samme id) — sikkerhedsnet mod historiske race-condition fejl
function dedupeShows(){
  const before=STATE.shows.length;
  const seen=new Map();
  STATE.shows.forEach(s=>{
    const prev=seen.get(s.id);
    // behold den med mest data, hvis der er en dublet
    if(!prev || (s.seasons||[]).length>(prev.seasons||[]).length) seen.set(s.id,s);
  });
  STATE.shows=[...seen.values()];
  if(STATE.shows.length!==before) saveState(); // dubletter fjernet -> gem med det samme, ellers overlever fixet ikke en genstart
}
function loadLocal(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)STATE=Object.assign(STATE,JSON.parse(raw));}catch(e){}
  if(!STATE.shows||!STATE.shows.length){ STATE.shows=SEED; STATE.lastRefresh=0; }
  dedupeShows();
}
// hent skyens data i baggrunden; nyeste (højeste lastRefresh) vinder
async function syncFromCloud(){
  if(!hasWorker){ setSync('ok','lokal'); return; }
  setSync('busy','synk');
  try{
    const r=await fetch(SYNC_URL,{headers:{Authorization:'Bearer '+SYNC_TOKEN}});
    if(r.ok){
      const remote=await r.json();
      if(remote&&remote.shows&&remote.shows.length){
        const rLast=remote.lastRefresh||0, lLast=STATE.lastRefresh||0;
        // skyen er nyere ELLER lokal er tom seed -> brug skyen
        if(rLast>=lLast){ STATE=remote; dedupeShows(); render(); }
        else { saveToCloud(); }   // lokal er nyere -> skub op
      } else {
        saveToCloud();            // sky tom -> initialisér den med lokal
      }
      setSync('ok','synk');
    } else setSync('err','fejl');
  }catch(e){ setSync('err','offline'); }
}
let saveTimer;
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(STATE));}catch(e){}
  if(!hasWorker)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToCloud,400);
}
async function saveToCloud(){
  if(!hasWorker)return;
  setSync('busy','gemmer');
  try{
    const r=await fetch(SYNC_URL,{method:'PUT',headers:{Authorization:'Bearer '+SYNC_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(STATE)});
    setSync(r.ok?'ok':'err',r.ok?'synk':'fejl');
  }catch(e){setSync('err','offline');}
}

/* ====== TMDB ====== */
function tmdb(path){return fetch("https://api.themoviedb.org/3"+path,{headers:{Authorization:"Bearer "+TMDB_BEARER}}).then(r=>r.json());}
// henter sæsoner — men KUN dem der reelt kan ændre sig. En sæson er "final" (afsluttet for altid)
// når alle dens afsnit er udkommet for et stykke tid siden, OG der findes en nyere sæson (eller serien er slut) —
// sæsoner forsvinder aldrig igen på TMDB, så en final sæson behøver aldrig genhentes.
// 'cachedSeasons' er seriens NUVÆRENDE gemte sæsoner (til at slå final-status op i).
// 'skipS0Probe' springer tjekket for specials helt over når vi allerede VED at serien ikke har nogen.
async function fetchSeasons(id, det, cachedSeasons, skipS0Probe){
  cachedSeasons=cachedSeasons||[];
  const cachedMap=new Map(cachedSeasons.map(se=>[se.s,se]));
  const listed=det.seasons.filter(s=>s.season_number>0).map(s=>s.season_number);
  const hasS0Listed=det.seasons.some(s=>s.season_number===0);
  const probeS0=!hasS0Listed && !skipS0Probe;
  const maxListed=listed.length?Math.max(...listed):0;

  // ægte sæsoner der reelt skal (gen)hentes: dem vi enten ikke har, eller ikke har markeret som final
  const needFetch=listed.filter(n=>{const c=cachedMap.get(n);return !c||!c.final;});
  const s0Cached=cachedMap.get(0);
  const fetchS0=(hasS0Listed && !(s0Cached&&s0Cached.final)) || probeS0;
  const nums=(fetchS0?[0]:[]).concat(needFetch);

  const FAILED=Symbol('failed');
  // alle nødvendige sæson-kald køres parallelt i ét hug, ikke sekventielt efter hinanden. Fejl mærkes eksplicit.
  const results=await Promise.all(nums.map(n=>tmdb(`/tv/${id}/season/${n}`).catch(()=>FAILED)));
  const resultByNum=new Map(nums.map((n,i)=>[n,results[i]]));

  // ægte sæsoner (season 0 kun hvis den var LISTET, ikke hvis den blot er en probe) må ikke fejle stille
  const mustSucceed=needFetch.concat(hasS0Listed&&fetchS0?[0]:[]);
  if(mustSucceed.some(n=>{const r=resultByNum.get(n);return r===FAILED||!r||!r.episodes;})) throw new Error('ufuldstændigt TMDB-svar for en rigtig sæson');

  const t=today();
  function toSeason(n,x){
    const episodes=x.episodes.map(e=>({e:e.episode_number,name:e.name,air:e.air_date,have:false}));
    const airedLongAgo=episodes.length>0 && episodes.every(e=>e.air && (Date.now()-new Date(e.air).getTime())>14*86400000);
    const newerSeasonExists=n<maxListed;
    const final=airedLongAgo && (newerSeasonExists || det.status==='Ended' || det.status==='Canceled');
    return {s:n, episodes, final};
  }
  const fresh=[];
  for(const n of nums){
    const r=resultByNum.get(n);
    if(r && r!==FAILED && r.episodes && r.episodes.length) fresh.push(toSeason(n,r));
  }
  // behold de cachede sæsoner vi IKKE gen-hentede (fordi de allerede var final)
  const kept=cachedSeasons.filter(se=> se.s===0 ? !fetchS0 : !needFetch.includes(se.s));
  const seasons=[...kept,...fresh].sort((a,b)=>a.s-b.s);
  const noSpecials=!seasons.some(se=>se.s===0);
  return {seasons, noSpecials};
}

/* ====== HAVE-LOGIK (override vinder over seed) ====== */
function epHave(show,sn,e){
  const k=show.id+':'+sn+':'+e.e;
  if(k in STATE.overrides) return STATE.overrides[k];
  return !!e.have;
}
function setHave(show,sn,e,val){
  const k=show.id+':'+sn+':'+e.e;
  STATE.overrides[k]=val;
  saveState();
}
const aired=e=> e.air && e.air<=today();
function showStatus(s){
  let a=0,h=0,m=0;
  let missSeasons=0, missLooseEps=0;
  s.seasons.forEach(se=>{
    const airedEps=se.episodes.filter(aired);
    if(!airedEps.length)return;
    const missingInSeason=airedEps.filter(e=>!epHave(s,se.s,e));
    a+=airedEps.length;
    h+=airedEps.length-missingInSeason.length;
    m+=missingInSeason.length;
    if(missingInSeason.length===0)return;
    // hel sæson mangler = alle udkomne afsnit i sæsonen mangler
    if(missingInSeason.length===airedEps.length) missSeasons++;
    else missLooseEps+=missingInSeason.length;
  });
  return {airedTotal:a,haveAired:h,missing:m,missSeasons,missLooseEps,done:m===0&&a>0};
}
// find næste ikke-udkomne afsnit (soonest air_date i fremtiden)
function nextUp(s){
  let best=null;
  s.seasons.forEach(se=>se.episodes.forEach(e=>{
    if(e.air && e.air>today()){
      if(!best || e.air<best.air) best={air:e.air,s:se.s,e:e.e};
    }
  }));
  return best;
}
// bygger pill-tekst: "2 sæsoner", "3 afsnit", eller "1 sæson · 2 afsnit"
function missingLabel(st){
  const parts=[];
  if(st.missSeasons) parts.push(`${st.missSeasons} ${st.missSeasons===1?'sæson':'sæsoner'}`);
  if(st.missLooseEps) parts.push(`${st.missLooseEps} ${st.missLooseEps===1?'afsnit':'afsnit'}`);
  return parts.join(' · ');
}

/* ====== RENDER ====== */
let FILTER='';
let ACTIVE_TAB='front';
function matchesFilter(i){
  if(!FILTER) return true;
  return STATE.shows[i].name.toLowerCase().includes(FILTER);
}
// arkiveret = afsluttet/aflyst OG komplet (intet udkommet mangler)
function isArchived(s){
  const ended = s.status==='Ended' || s.status==='Canceled';
  if(!ended) return false;
  const st=showStatus(s);
  return st.done; // samme definition som "komplet" — kræver mindst ét udkommet afsnit, undgår 0/0-serier der ellers ville arkiveres forkert
}
function render(){
  let front=[],done=[],archived=[];
  STATE.shows.forEach((s,i)=>{
    if(isArchived(s)){ archived.push(i); return; }
    (showStatus(s).done?done:front).push(i);
  });
  const yr=i=>parseInt(STATE.shows[i].year)||0;
  const nx=i=>nextUp(STATE.shows[i]);
  const upcomingFirst=(a,b)=>{
    const na=nx(a), nb=nx(b);
    if(na&&!nb) return -1;
    if(nb&&!na) return 1;
    if(na&&nb) return na.air.localeCompare(nb.air) || yr(b)-yr(a);
    return yr(b)-yr(a) || STATE.shows[a].name.localeCompare(STATE.shows[b].name);
  };
  front.sort(upcomingFirst);
  done.sort(upcomingFirst);
  archived.sort((a,b)=>yr(b)-yr(a) || STATE.shows[a].name.localeCompare(STATE.shows[b].name));

  const searching=!!FILTER;
  const frontF=front.filter(matchesFilter);
  const doneF=done.filter(matchesFilter);
  const archF=archived.filter(matchesFilter);
  const emptyFilter=`<p style="color:var(--faint);font-size:14px;padding:24px 4px;text-align:center">Ingen match på “${esc(FILTER)}”.</p>`;

  // --- MANGLER ---
  document.getElementById('front').innerHTML=(frontF.length?frontF.map(cardHTML).join(''):(searching?emptyFilter:uptodate()));

  // --- GENNEMFØRT (+ foldbar arkiv-sektion når man IKKE søger) ---
  let doneHTML;
  if(searching){
    doneHTML = doneF.length?doneF.map(cardHTML).join(''):emptyFilter;
  }else{
    doneHTML = done.length?done.map(cardHTML).join(''):`<p style="color:var(--faint);font-size:14px;padding:20px 4px;text-align:center">Ingen gennemførte serier endnu.</p>`;
    if(archived.length){
      doneHTML += `<div class="archsec ${ARCH_OPEN?'open':''}" id="archsec">
        <div class="archhead" onclick="toggleArchSec()"><span class="chev">${ICON_CHEV}</span> Arkiveret <span class="n">${archived.length}</span></div>
        <div class="archbody">${archived.map(cardHTML).join('')}</div>
      </div>`;
    }
  }
  document.getElementById('done').innerHTML=doneHTML;

  // --- ARKIVERET (kun ved søgning) ---
  document.getElementById('arch').innerHTML=(archF.length?archF.map(cardHTML).join(''):emptyFilter);

  // tæller
  document.getElementById('frontCount').textContent=searching?frontF.length:front.length;
  document.getElementById('doneCount').textContent=searching?doneF.length:done.length;
  document.getElementById('archCount').textContent=archF.length;
  // arkiv-tab vises kun ved søgning
  document.getElementById('archTab').classList.toggle('hide',!searching);

  let eps=0; STATE.shows.forEach(s=>s.seasons.forEach(se=>se.episodes.forEach(e=>{if(epHave(s,se.s,e))eps++;})));
  document.getElementById('stShows').textContent=STATE.shows.length;
  document.getElementById('stEps').textContent=eps;
  if(typeof renderUpdated==='function') renderUpdated();
  applyTabVisibility();
}
let ARCH_OPEN=false;
function toggleArchSec(){ ARCH_OPEN=!ARCH_OPEN; const el=document.getElementById('archsec'); if(el) el.classList.toggle('open',ARCH_OPEN); }
function applyTabVisibility(){
  ['front','done','arch'].forEach(t=>document.getElementById(t).classList.toggle('hide',t!==ACTIVE_TAB));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===ACTIVE_TAB));
}
function applyFilter(){
  const wasSearching=!!FILTER;
  FILTER=(document.getElementById('filter').value||'').trim().toLowerCase();
  document.getElementById('filterbar').classList.toggle('has',!!FILTER);
  // når man begynder at søge, start på Mangler-fanen
  if(FILTER && !wasSearching) ACTIVE_TAB='front';
  render();
}
function clearFilter(){
  document.getElementById('filter').value='';
  FILTER='';
  document.getElementById('filterbar').classList.remove('has');
  if(ACTIVE_TAB==='arch') ACTIVE_TAB='done';   // arkiv-fanen findes ikke uden søgning
  render();
}
function uptodate(){return `<div class="uptodate"><div class="big">Up to date 🎉</div><div class="sub">Vil du tilføje en ny serie?</div></div>`;}

const OPEN_IDS=new Set(); // show-id'er der er foldet ud — bevares på tværs af re-renders
function bodyHTML(idx){
  const s=STATE.shows[idx];
  return `${s.seasons.map(se=>seasonHTML(idx,se)).join('')}<div class="delbtn" onclick="removeShow(${idx})">Fjern serie</div>`;
}
function cardHTML(idx){
  const s=STATE.shows[idx],st=showStatus(s);
  const pct=st.airedTotal?Math.round(st.haveAired/st.airedTotal*100):0;
  const nSeasons=s.seasons.length;
  const nEps=st.airedTotal;
  const meta=`${nSeasons} ${nSeasons===1?'sæson':'sæsoner'} · ${nEps} ${nEps===1?'afsnit':'afsnit'}`;
  const archPill=isArchived(s)?`<span class="pill arch">arkiveret</span>`:'';
  const poster=s.poster?`https://image.tmdb.org/t/p/w154${s.poster}`:'';
  const nx=nextUp(s);
  // Mangler-kort: pill + næste-afsnit får egne rækker under progressbaren
  let statusRows='';
  if(!st.done){
    const label=missingLabel(st);
    const missRow=label?`<div class="statusrow"><span class="pill miss">${label} mangler</span></div>`:'';
    const nextRow=nx?`<div class="statusrow next"><span class="nextlabel">Næste afsnit</span><span class="nextval">${fmtNext(nx.air)}</span></div>`:'';
    statusRows=`<div class="bar"><i style="width:${pct}%"></i></div>${missRow}${nextRow}`;
  }
  const isOpen=OPEN_IDS.has(s.id);
  // kortets afsnit-liste bygges kun hvis kortet rent faktisk er foldet ud — sparer massivt DOM-arbejde på tværs af 132 serier ved hver opdatering
  const bodyContent=isOpen?bodyHTML(idx):'';
  return `<div class="card ${st.done?'done':''} ${isOpen?'open':''}" data-idx="${idx}" data-id="${s.id}">
    <div class="head" onclick="toggleCard(${idx})">
      <div class="posterwrap"><img class="poster" src="${poster}" alt="" loading="lazy" onerror="this.parentNode.classList.add('noimg')"><span class="ph">${ICON_PHOTO}</span></div>
      <div class="hmeta"><div class="htitle"><span class="tname">${esc(s.name)}</span>${archPill}</div><div class="hsub"><span>${s.year||''}</span><span class="sep">·</span><span>${meta}</span></div>${statusRows}</div>
      <span class="chev">${ICON_CHEV}</span>
    </div>
    <div class="body">${bodyContent}
    </div>
  </div>`;
}
function seasonHTML(idx,se){
  const s=STATE.shows[idx];
  const label = se.s===0 ? 'Specials' : 'Sæson '+se.s;
  // sæson-status: er alle udkomne afsnit hentet?
  const airedEps=se.episodes.filter(aired);
  const complete = airedEps.length>0 && airedEps.every(e=>epHave(s,se.s,e));
  const key = s.id+':'+se.s;
  // komplette sæsoner er foldet sammen som standard (medmindre brugeren har foldet dem ud)
  const open = SEASON_OPEN[key] || !complete;
  const haveCount=se.episodes.filter(e=>epHave(s,se.s,e)).length;
  return `<div class="season ${complete?'complete':''} ${open?'sopen':''}" data-skey="${key}">
    <div class="slabel" onclick="toggleSeasonFold('${key}',event)">
      <span class="sname">${complete?`<span class="sdot">${ICON_CHECK}</span> `:''}${label}</span>
      <span class="scount">${haveCount}/${se.episodes.length}</span>
      ${complete?`<span class="sfold">${ICON_CHEV}</span>`:`<span class="sallbtn" onclick="toggleSeason(${idx},${se.s},event)">markér alle</span>`}
    </div>
    <div class="sepisodes">${se.episodes.map(e=>epHTML(idx,se.s,e)).join('')}</div>
  </div>`;
}
function epHTML(idx,sn,e){
  const s=STATE.shows[idx];
  const fut=!aired(e), on=epHave(s,sn,e)&&!fut, date=e.air?fmtDate(e.air):'';
  return `<div class="ep ${fut?'future':''}">
    <div class="check ${on?'on':''}" onclick="toggleEp(${idx},${sn},${e.e},event)"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
    <span class="enum">S${String(sn).padStart(2,'0')}E${String(e.e).padStart(2,'0')}</span>
    <span class="ename">${esc(e.name||'Episode '+e.e)}</span>
    <span class="edate">${date}</span>
  </div>`;
}
let SEASON_OPEN={};
function toggleSeasonFold(key,ev){
  if(ev)ev.stopPropagation();
  const el=document.querySelector(`.season[data-skey="${key}"]`);
  if(!el)return;
  // kun komplette sæsoner kan foldes (de ufuldstændige er altid åbne)
  if(!el.classList.contains('complete'))return;
  SEASON_OPEN[key]=!el.classList.contains('sopen');
  el.classList.toggle('sopen',SEASON_OPEN[key]);
}
function esc(t){return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(iso){const m=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];const d=new Date(iso);if(isNaN(d))return iso;return d.getDate()+'. '+m[d.getMonth()]+" '"+String(d.getFullYear()).slice(2);}
function fmtShort(iso){const m=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];const d=new Date(iso);if(isNaN(d))return iso;const now=new Date();const days=Math.ceil((d-now)/86400000);if(days<=0)return 'i dag';if(days===1)return 'i morgen';if(days<=7)return 'om '+days+'d';return d.getDate()+'. '+m[d.getMonth()];}
function fmtNext(iso){const m=['jan.','feb.','mar.','apr.','maj','jun.','jul.','aug.','sep.','okt.','nov.','dec.'];const d=new Date(iso);if(isNaN(d))return iso;const now=new Date();const days=Math.ceil((d-now)/86400000);const dato=d.getDate()+'. '+m[d.getMonth()]+' '+d.getFullYear();let rel='';if(days<=0)rel='i dag';else if(days===1)rel='i morgen';else if(days<=13)rel='om '+days+' dage';else if(days<=60)rel='om '+Math.round(days/7)+' uger';else rel='om '+Math.round(days/30)+' mdr.';return `${dato} · ${rel}`;}

/* ====== INTERAKTION ====== */
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||10); }catch(e){} }
function toggleCard(i){
  const card=document.querySelector(`.card[data-idx="${i}"]`);
  if(!card)return;
  const s=STATE.shows[i];
  const willOpen=!card.classList.contains('open');
  if(willOpen){
    OPEN_IDS.add(s.id);
    card.querySelector('.body').innerHTML=bodyHTML(i);
  }else{
    OPEN_IDS.delete(s.id);
    card.querySelector('.body').innerHTML=''; // frigør DOM med det samme
  }
  card.classList.toggle('open',willOpen);
}
function toggleEp(idx,sn,en,ev){
  if(ev)ev.stopPropagation();
  const s=STATE.shows[idx];const e=s.seasons.find(x=>x.s===sn).episodes.find(x=>x.e===en);
  if(!aired(e))return;
  haptic(10);
  setHave(s,sn,e,!epHave(s,sn,e));
  rerenderKeepOpen(s.id);
}
function toggleSeason(idx,sn,ev){
  if(ev)ev.stopPropagation();
  haptic(15);
  const s=STATE.shows[idx];const se=s.seasons.find(x=>x.s===sn);
  const airedEps=se.episodes.filter(aired);
  const allOn=airedEps.every(e=>epHave(s,sn,e));
  airedEps.forEach(e=>setHave(s,sn,e,!allOn));
  rerenderKeepOpen(s.id);
}
function rerenderKeepOpen(id){
  render(); // cardHTML afgør nu selv åben/lukket-tilstand ud fra OPEN_IDS — ingen manuel gendannelse nødvendig
}
function removeShow(idx){
  const s=STATE.shows[idx];
  if(!confirm(`Fjern "${s.name}" fra listen?`))return;
  STATE.shows.splice(idx,1);
  Object.keys(STATE.overrides).forEach(k=>{if(k.startsWith(s.id+':'))delete STATE.overrides[k];});
  OPEN_IDS.delete(s.id);
  saveState();render();toast('Serie fjernet');
}
function switchTab(t){
  ACTIVE_TAB=t;
  applyTabVisibility();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}

/* ====== TILFØJ SERIE ====== */
function openSheet(){document.getElementById('sheetBg').classList.add('on');document.getElementById('sheet').classList.add('on');setTimeout(()=>document.getElementById('q').focus(),300);}
function closeSheet(){document.getElementById('sheetBg').classList.remove('on');document.getElementById('sheet').classList.remove('on');document.getElementById('q').value='';document.getElementById('results').innerHTML='<div class="loading">Skriv for at søge.</div>';}
let searchTimer;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(searchTimer);const q=e.target.value.trim();
  if(!q){document.getElementById('results').innerHTML='<div class="loading">Skriv for at søge.</div>';return;}
  document.getElementById('results').innerHTML='<div class="loading">Søger…</div>';
  searchTimer=setTimeout(()=>runSearch(q),350);
});
function runSearch(q){
  tmdb("/search/tv?query="+encodeURIComponent(q)).then(d=>{
    const res=(d.results||[]).slice(0,14);
    if(!res.length){document.getElementById('results').innerHTML='<div class="loading">Ingen resultater.</div>';return;}
    document.getElementById('results').innerHTML=res.map(r=>{
      const exists=STATE.shows.some(s=>s.id===r.id);
      const img=r.poster_path?`https://image.tmdb.org/t/p/w154${r.poster_path}`:'';
      const yr=(r.first_air_date||'').slice(0,4)||'—';
      return `<div class="res ${exists?'exists':''}" onclick="addShow(${r.id},this)">
        <img src="${img}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div><div class="t">${esc(r.original_name||r.name)}</div><div class="y">${yr}</div></div>
        <span class="add">${exists?ICON_CHECK:ICON_PLUS}</span>
      </div>`;
    }).join('');
  });
}
const ADDING_IDS=new Set();
async function addShow(id,el){
  if(STATE.shows.some(s=>s.id===id))return;
  if(ADDING_IDS.has(id))return;   // forhindrer dobbelt-tilføjelse ved dobbelt-tap
  ADDING_IDS.add(id);
  if(el)el.querySelector('.add').textContent='…';
  try{
    const det=await tmdb("/tv/"+id);
    if(!det || !Array.isArray(det.seasons)) throw new Error('ugyldigt svar fra TMDB');
    const {seasons, noSpecials}=await fetchSeasons(id, det, [], undefined);
    if(seasons.length===0) throw new Error('serien har ingen afsnit-data på TMDB endnu');
    if(STATE.shows.some(s=>s.id===id)){ ADDING_IDS.delete(id); return; } // dobbelt-tjek efter await
    STATE.shows.push({id,name:det.original_name||det.name,poster:det.poster_path,year:(det.first_air_date||'').slice(0,4),status:det.status,seasons,noSpecials});
    saveState();render();closeSheet();toast('Serie tilføjet');
  }catch(e){toast('Kunne ikke hente serie — prøv igen senere');if(el)el.querySelector('.add').innerHTML=ICON_PLUS;}
  finally{ ADDING_IDS.delete(id); }
}

/* ====== SIDST OPDATERET ====== */
function renderUpdated(){
  const el=document.getElementById('updated');
  const t=STATE.lastRefresh;
  if(!t){el.innerHTML='';return;}
  const diff=Date.now()-t, mins=Math.floor(diff/60000);
  let ago;
  if(mins<1) ago='lige nu';
  else if(mins<60) ago=mins+' min. siden';
  else{const h=Math.floor(mins/60); if(h<24) ago=h+' t. siden'; else ago=Math.floor(h/24)+' dg. siden';}
  el.innerHTML=`Data opdateret ${ago}`;
}
function manualRefresh(){
  const b=document.getElementById('refreshBtn');
  if(b) b.classList.add('spin');
  Promise.resolve(refreshFromTMDB(true,false)).finally(()=>{ if(b) b.classList.remove('spin'); });
}

/* ====== OVERLAY (kun allerførste gang, når der slet ingen data er) ====== */
function showOverlay(){document.getElementById('overlay').classList.remove('out');}
function hideOverlay(){document.getElementById('overlay').classList.add('out');}
function ovProgress(done,total){
  document.getElementById('ovBar').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ovSub').textContent=`Henter serier · ${done}/${total}`;
}

/* ====== AUTO-REFRESH episode-data fra TMDB ====== */
let refreshing=false;
const RECHECK_ENDED_DAYS=30; // afsluttede serier tjekkes ikke for evigt — de kigges til igen med jævne mellemrum i tilfælde af en genoplivning
// afgør om en serie kan springes over: afsluttet OG vi har alt udkommet OG vi har tjekket den for nylig
function canSkip(s){
  if(!s.status) return false;                       // ukendt status -> tjek altid
  if(!s.seasons || s.seasons.length===0) return false; // ingen data endnu/tømt -> tjek altid (selv-heling)
  const ended = s.status==='Ended' || s.status==='Canceled';
  if(!ended) return false;                          // igangværende -> tjek altid
  const st=showStatus(s);
  if(st.missing>0) return false;                    // afsluttet men mangler stadig noget -> tjek altid
  const daysSince = s.lastChecked ? (Date.now()-s.lastChecked)/86400000 : Infinity;
  return daysSince<=RECHECK_ENDED_DAYS;              // afsluttet + komplet + tjekket for nylig -> skip
}
async function refreshFromTMDB(force,firstRun){
  if(refreshing)return; refreshing=true;
  setSync('busy','opdaterer');

  // hvilke serier skal tjekkes?
  const targets = STATE.shows.filter(s => force || firstRun || !canSkip(s));
  const total=targets.length; let done=0; let changed=false;
  if(firstRun){ showOverlay(); ovProgress(0,total); }

  // kør i batches så det går hurtigt (parallelt), men uden at hamre API'et
  const BATCH=6;
  for(let i=0;i<targets.length;i+=BATCH){
    const slice=targets.slice(i,i+BATCH);
    await Promise.all(slice.map(async s=>{
      try{
        const det=await tmdb("/tv/"+s.id);
        // TMDB fejl/rate-limit giver et JSON-svar uden 'seasons' — det er IKKE en rigtig serie-opdatering
        if(!det || !Array.isArray(det.seasons)){ throw new Error('ugyldigt TMDB-svar'); }
        s.status=det.status||s.status;
        const {seasons:newSeasons, noSpecials}=await fetchSeasons(s.id, det, s.seasons, s.noSpecials);
        // SIKKERHED: aldrig erstatte eksisterende afsnit med en tom liste — det er altid et fejlet kald, ikke en rigtig ændring
        if(newSeasons.length===0 && s.seasons.length>0){ throw new Error('tomt sæson-svar, beholder eksisterende data'); }
        const oldMap={};s.seasons.forEach(se=>se.episodes.forEach(e=>{oldMap[se.s+':'+e.e]=e.have;}));
        newSeasons.forEach(se=>se.episodes.forEach(e=>{if(oldMap[se.s+':'+e.e]!==undefined)e.have=oldMap[se.s+':'+e.e];}));
        if(JSON.stringify(newSeasons)!==JSON.stringify(s.seasons)){s.seasons=newSeasons;changed=true;}
        if(s.noSpecials!==noSpecials){s.noSpecials=noSpecials;changed=true;}
        s.poster=det.poster_path||s.poster;
        // registrér hvornår en afsluttet+komplet serie sidst blev tjekket, så den kommer i spil igen efter RECHECK_ENDED_DAYS
        const nowEnded=(s.status==='Ended'||s.status==='Canceled') && showStatus(s).missing===0;
        if(nowEnded){ s.lastChecked=Date.now(); changed=true; }
      }catch(e){}
      done++;
      if(firstRun) ovProgress(done,total);
      setSync('busy','opdaterer '+done+'/'+total);
    }));
    if(changed) render();   // opdatér løbende så nye afsnit popper ind mens man kigger
  }

  STATE.lastRefresh=Date.now();
  if(changed) saveState(); else localStorage.setItem(STORAGE_KEY,JSON.stringify(STATE));
  render();
  setSync('ok',hasWorker?'synk':'lokal');
  if(firstRun) setTimeout(hideOverlay,300);
  refreshing=false;
}

/* ====== INIT ====== */
(async()=>{
  setTimeout(hideOverlay,30000); // sikkerhed
  loadLocal();                   // synkront — ingen ventetid
  let firstRun = !STATE.lastRefresh;
  render();                      // vis med det samme
  if(!firstRun) hideOverlay();
  await syncFromCloud();         // hent sky først (nyeste vinder) — undgår race
  // genvurdér: hvis skyen leverede allerede-frisk data (fx ny enhed, kendt bruger), er det ikke længere "første gang"
  firstRun = !STATE.lastRefresh;
  if(!firstRun) hideOverlay();
  refreshFromTMDB(false, firstRun); // så tjek TMDB i baggrunden
})();
</script>
